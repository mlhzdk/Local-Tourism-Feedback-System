<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tourism Feedback System</title>
  <style>
    :root {
      --primary-color: #2c3e50;
      --secondary-color: #3498db;
      --accent-color: #e74c3c;
      --light-color: #ecf0f1;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('view.jpg') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .welcome-container {
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 600px;
      overflow: hidden;
      text-align: center;
    }
    .welcome-header {
      background-color: var(--primary-color);
      color: white;
      padding: 30px 20px;
    }
    
    .welcome-header h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
    }
    
    .welcome-content {
      padding: 40px 30px;
    }
    
    .welcome-content p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #555;
      margin-bottom: 30px;
    }
    
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 30px;
    }
    
    .btn {
      display: inline-block;
      padding: 14px 20px;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .btn-primary {
      background-color: var(--secondary-color);
      color: white;
      border: 2px solid var(--secondary-color);
    }
    
    .btn-primary:hover {
      background-color: #2980b9;
      border-color: #2980b9;
    }
    
    .btn-secondary {
      background-color: white;
      color: var(--secondary-color);
      border: 2px solid var(--secondary-color);
    }
    
    .btn-secondary:hover {
      background-color: #f8f9fa;
    }
    
    @media (max-width: 576px) {
      .welcome-header h1 {
        font-size: 1.8rem;
      }
      
      .button-group {
        flex-direction: column;
      }
      
      .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="welcome-container">
    <div class="welcome-header">
      <h1>Tourism Feedback System</h1>
      <p>Welcome to our feedback portal</p>
    </div>
    
    <div class="welcome-content">
      <p>Help us improve our tourism services by sharing your experience. Your feedback is valuable to us!</p>
      
      <div class="button-group">
        <a href="hello.html" class="btn btn-primary">Start Survey</a>
        <a href="admin.html" class="btn btn-secondary">View Responses</a>
      </div>
    </div>
  </div>
</body>
</html>
