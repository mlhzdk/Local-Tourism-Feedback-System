<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tourism Feedback Form</title>
  <style>
    :root {
      --primary-color: #2c3e50;
      --secondary-color: #3498db;
      --light-color: #ecf0f1;
      --dark-color: #2c3e50;
      --success-color: #27ae60;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('view.jpg') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: var(--dark-color);
    }
    
    .feedback-container {
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 500px;
      overflow: hidden;
    }
    
    .form-header {
      background-color: var(--primary-color);
      color: white;
      padding: 20px;
      text-align: center;
    }
    
    .feedback-form {
      padding: 30px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-control {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 1rem;
    }
    
    .star-rating {
      display: flex;
      gap: 5px;
      margin-top: 5px;
    }
    
    .star-rating input {
      display: none;
    }
    
    .star-rating label {
      font-size: 28px;
      color: #ddd;
      cursor: pointer;
    }
    
    .star-rating input:checked ~ label,
    .star-rating label:hover,
    .star-rating label:hover ~ label {
      color: #f5b301;
    }
    
    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .checkbox-item {
      display: flex;
      align-items: center;
    }
    
    textarea {
      min-height: 120px;
      resize: vertical;
    }
    
    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: var(--secondary-color);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1.1rem;
      cursor: pointer;
      margin-top: 10px;
    }
    
    .confirmation-message {
      display: none;
      text-align: center;
      padding: 20px;
      background-color: var(--success-color);
      color: white;
      border-radius: 6px;
      margin-top: 20px;
    }
    .feedback-container {
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 500px;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <div class="feedback-container">
    <div class="form-header">
      <h2>Local Tourism Feedback</h2>
    </div>
 <form id="feedbackForm" class="feedback-form">
      <div class="form-group">
        <label for="language">Language:</label>
        <select id="language" name="language" class="form-control">
          <option value="en">English</option>
          <option value="fil">Filipino</option>
        </select>
      </div>
      
      <div class="form-group">
        <label for="nationality">Nationality:</label>
        <select id="nationality" name="nationality" class="form-control">
          <option value="local">Local</option>
          <option value="foreign">Foreign</option>
        </select>
      </div>
      
      <div class="form-group">
        <label for="visitDate">Visit Date:</label>
        <input type="date" id="visitDate" name="visitDate" class="form-control">
      </div>
      
      <div class="form-group">
        <label>Cleanliness Rating:</label>
        <div class="star-rating">
          <input type="radio" id="5-stars" name="rating" value="5" checked>
          <label for="5-stars">★</label>
          <input type="radio" id="4-stars" name="rating" value="4">
          <label for="4-stars">★</label>
          <input type="radio" id="3-stars" name="rating" value="3">
          <label for="3-stars">★</label>
          <input type="radio" id="2-stars" name="rating" value="2">
          <label for="2-stars">★</label>
          <input type="radio" id="1-star" name="rating" value="1">
          <label for="1-star">★</label>
        </div>
      </div>
      
      <div class="form-group">
        <label>Amenities Available:</label>
        <div class="checkbox-group">
          <label class="checkbox-item">
            <input type="checkbox" name="amenities" value="Restrooms">
            Restrooms
          </label>
          <label class="checkbox-item">
            <input type="checkbox" name="amenities" value="Parking">
            Parking
          </label>
          <label class="checkbox-item">
            <input type="checkbox" name="amenities" value="Guides">
            Guides
          </label>
        </div>
      </div>
      
      <div class="form-group">
        <label for="comments">Comments:</label>
        <textarea id="comments" name="comments" class="form-control"></textarea>
      </div>
      
      <button type="submit" class="btn-submit">Submit Feedback</button>
      
      <div id="confirmation" class="confirmation-message">
        <p>Thank you for your feedback!</p>
        <a href="welcome.html" style="
          display: inline-block;
          margin-top: 15px;
          padding: 10px 20px;
          background-color: #fff;
          color: var(--success-color);
          border: 2px solid #fff;
          border-radius: 6px;
          text-decoration: none;
          font-weight: bold;
        ">Back to Welcome Page</a>
      </div>      
    </form>
  </div>

  <script>
    document.getElementById('feedbackForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const formData = {
        language: document.getElementById('language').value,
        nationality: document.getElementById('nationality').value,
        visitDate: document.getElementById('visitDate').value,
        rating: document.querySelector('input[name="rating"]:checked').value,
        amenities: Array.from(document.querySelectorAll('input[name="amenities"]:checked')).map(el => el.value),
        comments: document.getElementById('comments').value,
        timestamp: new Date().toISOString()
      };
      
      let feedbacks = JSON.parse(localStorage.getItem('feedbacks')) || [];
      feedbacks.push(formData);
      localStorage.setItem('feedbacks', JSON.stringify(feedbacks));
      
      document.getElementById('confirmation').style.display = 'block';
      
      this.reset();
      
      setTimeout(() => {
        document.getElementById('confirmation').style.display = 'none';
      }, 3000);
    });
    
    document.getElementById('visitDate').valueAsDate = new Date();
  </script>
</body>
</html>
